<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Transaction</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
 <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="expense-form.html">Transaction</a>
    <a href="record-table.html">Records</a>
 </nav>

<div class="page-container">
<div class="form-container">
    <h1>Add New Transaction</h1>

    <form id="transactionForm" action="record-table.html" method="get" novalidate>
        <!-- Transaction Type -->
        <div class="form-group">
            <label for="type">Transaction Type</label>
            <select id="type" name="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>

        <!-- Transaction Category -->
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="Salary">Salary</option>
                <option value="Bonus">Bonus</option>
                <option value="Investment">Investment</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Transaction Amount -->
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0" required>
        </div>

        <!-- Transaction Date -->
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <!-- Transaction Note -->
        <div class="form-group">
            <label for="note">Note</label>
            <input type="text" id="note" name="note" placeholder="Enter optional notes">
        </div>

        <!-- Submit Button -->
        <div class="form-group">
            <button type="submit">Add Transaction</button>
        </div>
    </form>
</div>
<!-- Category filter dropdown -->
<div class="filter-section">
    <label for="category-select">Filter by category:</label>
    <select id="category-select">
        <option value="all">All</option>
        <option value="Salary">Salary</option>
        <option value="Bonus">Bonus</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Shopping">Shopping</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
    </select>
</div>

    <h2>Transaction List</h2>

    <!-- Transaction Records Table -->
    <table id="transaction-table" class="transaction-table">
      <thead>
        <tr>
            <th>Type</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Note</th>
            <th>Category</th>
        </tr>
      </thead>
      <tbody>
        
      </tbody>
    </table>
</div>



<script>
    const expenseCategories = ['Food', 'Transportation', 'Housing', 'Entertainment', 'Other'];
    const incomeCategories = ['Salary', 'Bonus', 'Investment', 'Other'];

    const typeSelect = document.querySelector('#type');
    const formCategorySelect = document.querySelector('#category');

    typeSelect.addEventListener('change', function() {
        const selectedType = this.value;
        let categories;
        if (selectedType === 'income') {
            categories = incomeCategories;
        } else {
            categories = expenseCategories;
        }

        formCategorySelect.innerHTML = '';
        categories.forEach(function(category) {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            formCategorySelect.appendChild(option);
        });
    });

    const transactions = [
        {
            type: 'Income',
            amount: 5000.00,
            date: '2026-09-01',
            note: 'salary',
            category: 'Salary'
        },
        {
            type: 'Expense',
            amount: 35.50,
            date: '2026-09-05',
            note: 'Lunch',
            category: 'Food'
        },
        {
            type: 'Expense',
            amount: 120.00,
            date: '2026-09-10',
            note: 'Groceries',
            category: 'Food'
        }
    ];
    
    function renderTransactions(data){
        const tbody = document.querySelector('#transaction-table tbody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            const emptyRow = document.createElement('tr');
            emptyRow.innerHTML = '<td colspan="5" style="text-align:center; color:#999;">No transactions records</td>';
            tbody.appendChild(emptyRow);
            return;
        }

        data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.type}</td>
                <td>${item.amount.toFixed(2)}</td>
                <td>${item.date}</td>
                <td>${item.note}</td>
                <td>${item.category}</td>
            `;
            tbody.appendChild(row);
        });
    }

    const amountInput = document.querySelector('#amount');
    const transactionForm = document.querySelector('#transactionForm');
    transactionForm.addEventListener('submit',function(event){
        event.preventDefault();
        let inputValue = amountInput.value.trim();

        if (inputValue === ''){
            alert('Amount cannot be empty');
            return;
        }

        const amount = Number(inputValue);
        if(isNaN(amount)){
            alert('Please enter a valid number');
            return;
        }

        if (amount<=0){
            alert('Amount must be greater than 0');
            return;
        }
        console.log('Validation passed, amount:', amount);
    });

    const categorySelect = document.querySelector('#category-select');
    function filterAndRender() {
        const selectedCategory = categorySelect.value;
        const filteredData = selectedCategory === 'all'
            ? transactions
            : transactions.filter(item => item.category === selectedCategory);

        renderTransactions(filteredData);
    }

    categorySelect.addEventListener('change', filterAndRender);
    
    filterAndRender();

</script>

</body>
</html>
