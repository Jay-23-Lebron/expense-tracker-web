<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Transaction</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
<div class="page-container">
<div class="form-container">
    <h1>Add New Transaction</h1>

    <form id="transactionForm" action="record-table.html" method="get" novalidate>
        <!-- Transaction Type -->
        <div class="form-group">
            <label for="type">Transaction Type</label>
            <select id="type" name="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>

        <!-- Transaction Amount -->
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0" required>
        </div>

        <!-- Transaction Date -->
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <!-- Transaction Note -->
        <div class="form-group">
            <label for="note">Note</label>
            <input type="text" id="note" name="note" placeholder="Enter optional notes">
        </div>

        <!-- Submit Button -->
        <div class="form-group">
            <button type="submit">Add Transaction</button>
        </div>
    </form>
</div>

    <h2>Transaction List</h2>

    <!-- Transaction Records Table -->
    <table class="transaction-table">
        <tr>
            <th>Type</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Note</th>
        </tr>
        <tr>
            <td>Income</td>
            <td>5000.00</td>
            <td>2026-09-01</td>
            <td>salary</td>
        </tr>
        <tr>
            <td>Expense</td>
            <td>35.50</td>
            <td>2026-09-05</td>
            <td>Lunch</td>
        </tr>
        <tr>
            <td>Expense</td>
            <td>120.00</td>
            <td>2026-09-10</td>
            <td>Groceries</td>
        </tr>
    </table>
</div>

<script>
    const amountInput = document.querySelector('#amount');
    const transactionForm = document.querySelector('#transactionForm');
    transactionForm.addEventListener('submit',function(event){
        event.preventDefault();
        let inputValue = amountInput.value.trim();

        if (inputValue === ''){
            alert('Amount cannot be empty');
            return;
        }

        const amount = Number(inputValue);
        if(isNaN(amount)){
            alert('Please enter a valid number');
            return;
        }

        if (amount<=0){
            alert('Amount must be greater than 0');
            return;
        }
        console.log('Validation passed, amount:', amount);
    });
</script>

</body>
</html>
