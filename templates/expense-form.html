<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Transaction</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
<div class="page-container">
<div class="form-container">
    <h1>Add New Transaction</h1>

    <form id="transactionForm" action="record-table.html" method="get" novalidate>
        <!-- Transaction Type -->
        <div class="form-group">
            <label for="type">Transaction Type</label>
            <select id="type" name="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>

        <!-- Transaction Amount -->
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0" required>
        </div>

        <!-- Transaction Date -->
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <!-- Transaction Note -->
        <div class="form-group">
            <label for="note">Note</label>
            <input type="text" id="note" name="note" placeholder="Enter optional notes">
        </div>

        <!-- Submit Button -->
        <div class="form-group">
            <button type="submit">Add Transaction</button>
        </div>
    </form>
</div>
<!-- Category filter dropdown -->
<div class="filter-section">
    <label for="category-select">Filter by category:</label>
    <select id="category-select">
        <option value="all">All</option>
        <option value="food">Dining</option>
        <option value="transport">Transport</option>
        <option value="rent">Rent</option>
        <option value="income">Income</option>
    </select>
</div>

    <h2>Transaction List</h2>

    <!-- Transaction Records Table -->
    <table id="transaction-table" class="transaction-table">
      <thead>
        <tr>
            <th>Type</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Note</th>
        </tr>
      </thead>
      <tbody>
        <tr>
            <td>Income</td>
            <td>5000.00</td>
            <td>2026-09-01</td>
            <td>salary</td>
        </tr>
        <tr>
            <td>Expense</td>
            <td>35.50</td>
            <td>2026-09-05</td>
            <td>Lunch</td>
        </tr>
        <tr>
            <td>Expense</td>
            <td>120.00</td>
            <td>2026-09-10</td>
            <td>Groceries</td>
        </tr>
      </tbody>
    </table>
</div>



<script>
    const transactions = [
        {
            type: 'Income',
            amount: 5000.00,
            date: '2026-09-01',
            note: 'salary',
            category: 'income'
        },
        {
            type: 'Expense',
            amount: 35.50,
            date: '2026-09-05',
            note: 'Lunch',
            category: 'food'
        },
        {
            type: 'Expense',
            amount: 120.00,
            date: '2026-09-10',
            note: 'Groceries',
            category: 'food'
        }
    ];
    
    function renderTransactions(data){
        const tbody = document.querySelector('#transaction-table tbody');
        tbody.innerHTML = '';
        data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.type}</td>
                <td>${item.amount}</td>
                <td>${item.date}</td>
                <td>${item.note}</td>
            `;
            tbody.appendChild(row);
        });
    }

    const amountInput = document.querySelector('#amount');
    const transactionForm = document.querySelector('#transactionForm');
    transactionForm.addEventListener('submit',function(event){
        event.preventDefault();
        let inputValue = amountInput.value.trim();

        if (inputValue === ''){
            alert('Amount cannot be empty');
            return;
        }

        const amount = Number(inputValue);
        if(isNaN(amount)){
            alert('Please enter a valid number');
            return;
        }

        if (amount<=0){
            alert('Amount must be greater than 0');
            return;
        }
        console.log('Validation passed, amount:', amount);
    });

    const categorySelect = document.querySelector('#category-select');
    categorySelect.addEventListener('change', function(e){
        const selectedCategory = e.target.value;
        console.log('Selected category:', selectedCategory);
    });

    renderTransactions(transactions);
</script>

</body>
</html>
